<!doctype html>
<!-- Benign docs page with copy buttons: must copy unchanged, never block. -->
<html><head><meta charset="utf-8"><title>Install guide</title></head>
<body>
  <h1>Install guide</h1>
  <pre id="npm">npm install --save express</pre><button id="copy-npm">Copy</button>
  <pre id="docker">curl -fsSL https://get.docker.com | sh</pre><button id="copy-docker">Copy</button>
  <script>
    for (const id of ['npm', 'docker']) {
      document.getElementById('copy-' + id).addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(document.getElementById(id).textContent); window.copyResult = 'ok'; }
        catch (e) { window.copyResult = String(e); }
      });
    }
  </script>
</body></html>
