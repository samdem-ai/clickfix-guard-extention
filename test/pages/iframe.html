<!doctype html>
<!-- Lure inside a cross-origin iframe: the warning must still appear in the top page. -->
<html><head><meta charset="utf-8"><title>News site</title></head>
<body>
  <h1>Totally normal news site</h1>
  <iframe id="f" width="500" height="300" allow="clipboard-write"></iframe>
  <script>
    // Same pages, other origin (localhost vs 127.0.0.1) so the frame is cross-origin.
    const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
    document.getElementById('f').src = `${location.protocol}//${other}:${location.port}/captcha.html`;
  </script>
</body></html>
